# Nombre de la aplicación
spring.application.name=cook-list

# Puerto del servidor
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/cook-list-api

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cook_list}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.placeholders.ADMIN_PASSWORD=${ADMIN_PASSWORD}
spring.flyway.placeholders.USER_PASSWORD=${USER_PASSWORD}

logging.level.org.springframework.security=TRACE

# Carga las variables del .env de la raiz (formato properties); opcional para no fallar en despliegues donde las variables ya existen
spring.config.import=optional:file:.env[.properties]
